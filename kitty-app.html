<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --stage:#E7EBEF; --phone:#FFFFFF; --ink:#141D26; --soft:#64717E; --line:#E2E7EC;
    --pot:#1C6B4E; --pot-soft:#E2F0E9; --warn:#A8531B; --warn-soft:#FCEBDC; --red:#B3261E; --red-soft:#FAE3E1;
    --chrome:#0E1620;
    --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    --text:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --stage:#10161C; --phone:#1A232C; --ink:#EDF2F6; --soft:#9FADBA; --line:#2B3741;
      --pot:#6CC89D; --pot-soft:#1D3A2F; --warn:#E9A96C; --warn-soft:#3A2B1C; --red:#F08279; --red-soft:#3A1F1D;
      --chrome:#05090D;
    }
  }
  :root[data-theme="dark"]{
    --stage:#10161C; --phone:#1A232C; --ink:#EDF2F6; --soft:#9FADBA; --line:#2B3741;
    --pot:#6CC89D; --pot-soft:#1D3A2F; --warn:#E9A96C; --warn-soft:#3A2B1C; --red:#F08279; --red-soft:#3A1F1D;
    --chrome:#05090D;
  }
  *,*::before,*::after{box-sizing:inherit}
  body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--text);line-height:1.5}
  .page{max-width:460px;margin:0 auto;padding:22px 16px 48px;display:flex;flex-direction:column;align-items:center}
  .wordmark{font-family:var(--display);font-weight:700;font-size:20px;align-self:flex-start;margin-bottom:14px}
  .wordmark span{color:var(--pot)}

  .phone{width:100%;max-width:330px;background:var(--chrome);border-radius:40px;padding:9px;
         box-shadow:0 18px 40px rgba(10,20,30,.22)}
  .screen{background:var(--phone);border-radius:32px;overflow:hidden;height:580px;display:flex;flex-direction:column;position:relative}
  .status{display:flex;justify-content:space-between;align-items:center;padding:11px 20px 5px;font-size:11.5px;color:var(--soft)}
  .notch{width:70px;height:5px;border-radius:99px;background:var(--line)}
  .appbar{padding:6px 18px 10px;display:flex;justify-content:space-between;align-items:center}
  .appbar h1{font-family:var(--display);font-size:17px;font-weight:600;margin:0}
  .appbar .av{width:28px;height:28px;border-radius:50%;background:var(--pot-soft);color:var(--pot);
              display:grid;place-items:center;font-size:12px;font-weight:600}
  .body{flex:1;overflow-y:auto;padding:4px 18px 14px}
  .tabs{display:flex;border-top:1px solid var(--line);padding:9px 10px calc(10px + env(safe-area-inset-bottom,0px))}
  .tab{flex:1;text-align:center;font-size:10.5px;color:var(--soft)}
  .tab .ic{display:block;font-size:16px;line-height:1.4;filter:grayscale(1);opacity:.55}
  .tab.on{color:var(--pot);font-weight:600}
  .tab.on .ic{filter:none;opacity:1}

  .potcard{background:var(--pot-soft);border-radius:18px;padding:16px 16px 14px;margin:6px 0 14px}
  .potcard .lbl{font-size:11.5px;color:var(--pot);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  .potcard .amt{font-family:var(--display);font-size:38px;font-weight:700;letter-spacing:-.025em;line-height:1.1;margin:2px 0 2px}
  .potcard .sub{font-size:12.5px;color:var(--soft)}
  .potcard.warnstate{background:var(--red-soft)}
  .potcard.warnstate .lbl{color:var(--red)} .potcard.warnstate .amt{color:var(--red)}

  .sec{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin:14px 0 7px}
  .list{border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-top:1px solid var(--line);font-size:14px}
  .item:first-child{border-top:0}
  .ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;
       background:var(--line);color:var(--ink);flex:none}
  .item .nm{flex:1;min-width:0}
  .item .nm b{display:block;font-weight:500}
  .item .nm em{font-style:normal;font-size:12px;color:var(--soft)}
  .item .amt{font-variant-numeric:tabular-nums;font-size:13.5px}
  .pill{font-size:10.5px;padding:3px 8px;border-radius:99px;background:var(--pot-soft);color:var(--pot);font-weight:600;white-space:nowrap}
  .pill.bad{background:var(--warn-soft);color:var(--warn)}
  .pill.red{background:var(--red-soft);color:var(--red)}

  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 4px}
  .bar i{display:block;height:100%;background:var(--pot);width:0;transition:width .7s ease}
  .bar.red i{background:var(--red)}
  .barnote{font-size:11.5px;color:var(--soft);display:flex;justify-content:space-between}

  .push{position:absolute;left:12px;right:12px;top:14px;background:var(--phone);border:1px solid var(--line);
        border-radius:16px;padding:12px 14px;box-shadow:0 10px 24px rgba(10,20,30,.18);
        transform:translateY(-130%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2);z-index:5}
  .push.in{transform:translateY(0)}
  .push .hd{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--soft);margin-bottom:5px}
  .push .dotapp{width:16px;height:16px;border-radius:5px;background:var(--pot)}
  .push b{display:block;font-size:13.5px;margin-bottom:2px}
  .push p{margin:0;font-size:12.5px;color:var(--soft)}

  .cta{display:block;width:100%;font:inherit;font-size:14px;font-weight:500;color:#fff;background:var(--pot);
       border:0;border-radius:12px;padding:12px;margin-top:12px;cursor:default}
  .cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);margin-top:8px}

  .caption{margin-top:20px;width:100%;max-width:330px}
  .step{font-size:12px;color:var(--soft);margin-bottom:5px}
  .caption h2{font-family:var(--display);font-size:18px;font-weight:600;margin:0 0 6px;line-height:1.3}
  .caption p{margin:0;font-size:14.5px;color:var(--soft)}
  .nav{display:flex;gap:9px;align-items:center;margin-top:16px}
  .nav button{font:inherit;font-size:14px;border-radius:10px;padding:10px 16px;cursor:pointer;
              border:1px solid var(--pot);background:var(--pot);color:#fff}
  .nav button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .nav button:disabled{opacity:.4;cursor:default}
  .nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .dots{margin-left:auto;display:flex;gap:5px}
  .d{width:6px;height:6px;border-radius:50%;background:var(--line)}
  .d.on{background:var(--pot)}
  footer{max-width:330px;width:100%;margin-top:22px;font-size:11.5px;color:var(--soft);line-height:1.55}
</style>
</head>
<body>
<div class="page">
  <div class="wordmark">kitty<span>.</span></div>

  <div class="phone">
    <div class="screen">
      <div class="push" id="push">
        <div class="hd"><span class="dotapp"></span> Kitty · now</div>
        <b id="pushTitle"></b>
        <p id="pushBody"></p>
      </div>

      <div class="status"><span>9:41</span><span class="notch"></span><span>▮▮▮</span></div>
      <div class="appbar">
        <h1 id="appTitle">Newtown house</h1>
        <div class="av">V</div>
      </div>
      <div class="body" id="body"></div>
      <div class="tabs" id="tabs">
        <div class="tab on"><span class="ic">🏠</span>Home</div>
        <div class="tab"><span class="ic">🧾</span>Bills</div>
        <div class="tab"><span class="ic">👥</span>House</div>
        <div class="tab"><span class="ic">⚙️</span>Settings</div>
      </div>
    </div>
  </div>

  <div class="caption">
    <div class="step" id="stepNo"></div>
    <h2 id="capTitle"></h2>
    <p id="capBody"></p>
    <div class="nav">
      <button class="ghost" id="back">Back</button>
      <button id="next">Next</button>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <footer>Prototype for FINS5548. The household, residents and transactions are synthetic. No real funds move and no bank data is used.</footer>
</div>

<script>
(function(){
  function ava(n,cls){ return '<div class="ava '+(cls||'')+'">'+n+'</div>'; }

  var HOME = function(opts){
    opts = opts || {};
    var potClass = opts.warn ? " warnstate" : "";
    return ''+
    '<div class="potcard'+potClass+'">'+
      '<div class="lbl">'+(opts.lbl||"In the pot")+'</div>'+
      '<div class="amt">'+(opts.amt||"$544")+'</div>'+
      '<div class="sub">'+(opts.sub||"Monday 1 June · rent paid")+'</div>'+
      '<div class="bar'+(opts.warn?" red":"")+'"><i style="width:'+(opts.pct||73)+'%"></i></div>'+
      '<div class="barnote"><span>'+(opts.l||"Saved for the power bill")+'</span><span>'+(opts.r||"$544 of $742")+'</span></div>'+
    '</div>'+
    '<div class="sec">This week</div>'+
    '<div class="list">'+
      '<div class="item">'+ava("P")+'<div class="nm"><b>Priya</b><em>Double room</em></div><span class="amt">$372.68</span><span class="pill">Paid</span></div>'+
      '<div class="item">'+ava("T")+'<div class="nm"><b>Tom</b><em>Double room</em></div><span class="amt">$372.68</span><span class="pill">Paid</span></div>'+
      '<div class="item">'+ava("J")+'<div class="nm"><b>Jai</b><em>Single room</em></div><span class="amt">$332.68</span><span class="pill'+(opts.jai==="bad"?" bad":(opts.jai==="fixed"?"":""))+'">'+(opts.jai==="bad"?"Failed":(opts.jai==="fixed"?"Paid + arrears":"Paid"))+'</span></div>'+
      '<div class="item">'+ava("G")+'<div class="nm"><b>Grace</b><em>Single room</em></div><span class="amt">$332.68</span><span class="pill">Paid</span></div>'+
    '</div>'+
    '<div class="sec">Coming up</div>'+
    '<div class="list">'+
      '<div class="item"><div class="nm"><b>Rent</b><em>Inner West Realty · Monday</em></div><span class="amt">$1,280</span></div>'+
      '<div class="item"><div class="nm"><b>Internet</b><em>FibreNet · 18 June</em></div><span class="amt">$89</span></div>'+
      '<div class="item"><div class="nm"><b>Electricity</b><em>Sydney Power Co · 14 July</em></div><span class="amt">$742</span>'+
        (opts.flag?'<span class="pill red">Short</span>':'')+'</div>'+
    '</div>';
  };

  var SHORTFALL = ''+
    '<div class="potcard warnstate">'+
      '<div class="lbl">Projected when the bill is paid</div>'+
      '<div class="amt">−$194</div>'+
      '<div class="sub">Electricity $742, due 14 July</div>'+
      '<div class="bar red"><i style="width:74%"></i></div>'+
      '<div class="barnote"><span>Pot will reach</span><span>$548 of $742</span></div>'+
    '</div>'+
    '<div class="sec">Why</div>'+
    '<div class="list">'+
      '<div class="item"><div class="nm"><b>Jai · 1 June</b><em>Direct debit failed</em></div><span class="amt">−$332.68</span></div>'+
      '<div class="item"><div class="nm"><b>Jai · 8 June</b><em>Direct debit failed</em></div><span class="amt">−$332.68</span></div>'+'<div class="item"><div class="nm"><b>Jai · 22 June</b><em>Direct debit due</em></div><span class="amt">−$332.68</span></div>'+
    '</div>'+
    '<div class="sec">Fix it</div>'+
    '<button class="cta">Send Jai a reminder</button>'+
    '<button class="cta ghost">Add $38.80 a week to everyone</button>';

  var FIXED = ''+
    '<div class="potcard">'+
      '<div class="lbl">After arrears were collected</div>'+
      '<div class="amt">$804</div>'+
      '<div class="sub">Electricity settled and the pot back in credit</div>'+
      '<div class="bar"><i style="width:100%"></i></div>'+
      '<div class="barnote"><span>Pot after arrears collected</span><span>$804</span></div>'+
    '</div>'+
    '<div class="sec">What happened</div>'+
    '<div class="list">'+
      '<div class="item">'+ava("J")+'<div class="nm"><b>Jai cleared his arrears</b><em>27 July · three missed weeks</em></div><span class="amt">$998</span><span class="pill">Paid</span></div>'+
      '<div class="item"><div class="nm"><b>Electricity</b><em>Sydney Power Co · 21 July</em></div><span class="amt">$742</span><span class="pill">Paid</span></div>'+
    '</div>'+
    '<div class="sec">The house this quarter</div>'+
    '<div class="list">'+
      '<div class="item"><div class="nm"><b>Transfers nobody had to make</b><em>March to August</em></div><span class="amt">104</span></div>'+
      '<div class="item"><div class="nm"><b>Collection success rate</b><em>March to August</em></div><span class="amt">97%</span></div>'+
    '</div>';

  var steps = [
    { title:"One account for the whole house",
      body:"Four housemates in Newtown. Kitty shows everyone the same screen: what is in the pot, who has paid, and what is due next.",
      screen: HOME({}), tab:0, appTitle:"Newtown house", push:null },

    { title:"Everyone's share is collected automatically",
      body:"Each Monday Kitty debits each person's share. Rent is split by room, bills equally. Nobody transfers anything and nobody is asked.",
      screen: HOME({}), tab:0, appTitle:"Newtown house", push:null },

    { title:"One payment fails",
      body:"Jai's account was empty on Monday 8 June, the second failure this month. In a normal share house nobody notices for weeks, because nobody is keeping track.",
      screen: HOME({jai:"bad", amt:"$308", sub:"Monday 8 June · one payment failed", pct:41, r:"$308 of $742"}),
      tab:0, appTitle:"Newtown house", push:null },

    { title:"Kitty warns the house five weeks early",
      body:"It compares what the pot will hold on 14 July against the $742 electricity bill, and sends everyone the same notification. In the data, the pot reaches $548 and the bill leaves it $194 short.",
      screen: HOME({jai:"bad", flag:true, amt:"$281", sub:"Collected this Monday · one payment failed", pct:28, r:"$281 of $742"}),
      tab:0, appTitle:"Newtown house",
      push:{t:"The pot will be $194 short", b:"The electricity bill is due 14 July. Tap to see how to fix it."} },

    { title:"The shortfall, and two ways out",
      body:"Jai can clear the three missed weeks, or the house can add $38.80 each per week until the bill arrives. The choice stays with the household.",
      screen: SHORTFALL, tab:1, appTitle:"Electricity · 14 July", push:null },

    { title:"The pot recovers, nobody chased anybody",
      body:"Once Jai cleared the three missed weeks the pot recovered. Every other bill in the six months of data was paid on time.",
      screen: FIXED, tab:1, appTitle:"Electricity · paid", push:null }
  ];

  var i=0,
      body=document.getElementById("body"), tabs=document.getElementById("tabs"),
      appTitle=document.getElementById("appTitle"), push=document.getElementById("push"),
      pushTitle=document.getElementById("pushTitle"), pushBody=document.getElementById("pushBody"),
      stepNo=document.getElementById("stepNo"), capTitle=document.getElementById("capTitle"),
      capBody=document.getElementById("capBody"), back=document.getElementById("back"),
      next=document.getElementById("next"), dots=document.getElementById("dots");

  steps.forEach(function(){ var d=document.createElement("div"); d.className="d"; dots.appendChild(d); });

  function render(){
    var s=steps[i];
    body.innerHTML=s.screen;
    body.scrollTop=0;
    appTitle.textContent=s.appTitle;
    Array.prototype.forEach.call(tabs.children,function(t,n){ t.className="tab"+(n===s.tab?" on":""); });
    push.classList.remove("in");
    if(s.push){
      pushTitle.textContent=s.push.t; pushBody.textContent=s.push.b;
      setTimeout(function(){ if(steps[i].push) push.classList.add("in"); },350);
    }
    stepNo.textContent="Step "+(i+1)+" of "+steps.length;
    capTitle.textContent=s.title; capBody.textContent=s.body;
    back.disabled=(i===0);
    next.textContent=(i===steps.length-1)?"Start again":"Next";
    Array.prototype.forEach.call(dots.children,function(d,n){ d.className="d"+(n===i?" on":""); });
    var fill=body.querySelector(".bar i");
    if(fill){ var w=fill.style.width; fill.style.width="0%"; requestAnimationFrame(function(){ fill.style.width=w; }); }
  }
  next.addEventListener("click",function(){ i=(i===steps.length-1)?0:i+1; render(); });
  back.addEventListener("click",function(){ if(i>0){ i--; render(); } });
  render();
})();
</script>
</body>
</html>
